name: nvtop
base: core22
adopt-info: nvtop
summary: 'GPUs monitoring tool for AMD, Intel and NVIDIA'
description: |
  Nvtop stands for Neat Videocard TOP, a (h)top like task monitor for AMD, Intel and NVIDIA GPUs. It can handle multiple GPUs and print information about them in a htop familiar way.
license: GPL-3.0-or-later
issues: https://github.com/Syllo/nvtop/issues
icon: desktop/nvtop.svg
grade: stable
confinement: strict
architectures:
- build-on: amd64
- build-on: arm64
- build-on: armhf
- build-on: ppc64el
- build-on: s390x
compression: lzo
apps:
  nvtop:
    command: usr/bin/nvtop
    desktop: usr/share/applications/nvtop.desktop
    plugs:
    - opengl
    - home
    - hardware-observe
    - process-control
    - system-observe
    # - kubernetes-support # Temporarily required for nvtop to display AMD GPU processes. Once apparmor rule to allow access to @{PROC}/[0-9]*/fdinfo/ is added to system-observe, this can be removed.
    environment:
      # The staged terminfo db is outside ncurses search path
      TERMINFO_DIRS: $SNAP/usr/share/terminfo:$SNAP/lib/terminfo:$SNAP/etc/terminfo:/usr/share/terminfo:/lib/terminfo:/etc/terminfo
# layout:
#   /usr/share/libdrm:
#     symlink: $SNAP/usr/share/libdrm
parts:
  extra-terminfo:
    # Ghostty and WezTerm postdate core22's ncurses 6.3 and have no Ubuntu
    # terminfo package of their own, so their entries are compiled here.
    #
    # WezTerm publishes its terminfo as a plain source file, so it is fetched
    # from a pinned commit and checksum-verified at build time.
    #
    # Ghostty maintains its terminfo as Zig source (src/terminfo/ghostty.zig)
    # and only emits a .terminfo when built, so there is no upstream file to
    # pin. Its entry is vendored in snap/local/terminfo instead.
    plugin: nil
    source: snap/local/terminfo
    build-packages:
    - ncurses-bin
    - curl
    - ca-certificates
    override-pull: |
      set -eux
      craftctl default
      # wezterm/wezterm termwiz/data/wezterm.terminfo, last changed 2025-05-03
      # ("Advertize the Su capability too"). The newest tagged release predates
      # that commit, so pin the commit rather than the tag.
      wezterm_commit=52c3515037518b826f32609179383948217d5a33
      wezterm_sha256=5e386fb149b2a16b71b4d9a373c54737c9e5694eb67fe38d93b24705b93437ed
      curl -sSfL -o wezterm.terminfo \
        "https://raw.githubusercontent.com/wezterm/wezterm/${wezterm_commit}/termwiz/data/wezterm.terminfo"
      echo "${wezterm_sha256}  wezterm.terminfo" | sha256sum -c -
    override-build: |
      set -eux
      terminfo_dir="$CRAFT_PART_INSTALL/usr/share/terminfo"
      mkdir -p "$terminfo_dir"
      for src in *.terminfo; do
        tic -x -o "$terminfo_dir" "$src"
      done
  libdrm:
    source: https://gitlab.freedesktop.org/mesa/drm.git
    source-tag: libdrm-2.4.113
    plugin: meson
    meson-parameters:
    - --prefix=/usr
    - --sysconfdir=/etc
    - --libdir=lib/$CRAFT_ARCH_TRIPLET
    - -Dradeon=enabled
    - -Damdgpu=enabled
    - -Dudev=true
    - -Dnouveau=enabled
    - -Dintel=enabled
    build-packages:
    - meson
    - pkg-config
    - libudev-dev
    - libpciaccess-dev
    stage-packages:
    - libpciaccess0
    prime:
    - -usr/include
    - -usr/lib/$CRAFT_ARCH_TRIPLET/pkgconfig
  nvtop:
    after: [ libdrm ]
    source: .
    plugin: cmake
    cmake-parameters:
    - -DCMAKE_INSTALL_PREFIX=/usr
    - -DNVIDIA_SUPPORT=ON
    - -DAMDGPU_SUPPORT=ON
    - -DINTEL_SUPPORT=ON
    override-pull: |
      set -eux
      craftctl default
      VERSION="$(git describe --tags $(git rev-list --tags --max-count=1))"
      craftctl set version=$VERSION
      git checkout $VERSION
    build-snaps:
    - cmake
    build-packages:
    - gcc
    - libncurses-dev
    - libsystemd-dev
    stage-packages:
    - libncurses6
    - libncursesw6
    - libsystemd0
    - ncurses-base
    - ncurses-term
    - kitty-terminfo
    - foot-terminfo
    prime:
    - -usr/share/doc
