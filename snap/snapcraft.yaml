name: nvtop
base: core26
adopt-info: nvtop
summary: 'GPUs monitoring tool for AMD, Intel and NVIDIA'
description: |
  Nvtop stands for Neat Videocard TOP, a (h)top like task monitor for AMD, Intel and NVIDIA GPUs. It can handle multiple GPUs and print information about them in a htop familiar way.
license: GPL-3.0-or-later
issues: https://github.com/Syllo/nvtop/issues
icon: desktop/nvtop.svg
grade: stable
confinement: strict
platforms:
  amd64:
  arm64:
  armhf:
  ppc64el:
  s390x:
compression: lzo
apps:
  nvtop:
    command: usr/bin/nvtop
    desktop: usr/share/applications/nvtop.desktop
    plugs:
    - opengl
    - home
    - hardware-observe
    - process-control
    - system-observe
    # - kubernetes-support # Temporarily required for nvtop to display AMD GPU processes. Once apparmor rule to allow access to @{PROC}/[0-9]*/fdinfo/ is added to system-observe, this can be removed.
    environment:
      # ncurses-term stages the kitty, foot, ghostty and wezterm entries, but
      # the staged db is not in ncurses' compiled-in search path; point
      # TERMINFO_DIRS at it (ncurses still searches the base snap's locations
      # afterwards).
      TERMINFO_DIRS: $SNAP/usr/share/terminfo
# layout:
#   /usr/share/libdrm:
#     symlink: $SNAP/usr/share/libdrm
parts:
  ghostty-terminfo:
    # Ubuntu's ncurses-term ships the "ghostty" entry but not "xterm-ghostty",
    # which is Ghostty's default $TERM. The Ubuntu "ghostty" package ships the
    # compiled entry; the terminfo payload is architecture-independent data, so
    # the amd64 binary package is used for every build target.
    #
    # The terminfo data is MIT-licensed:
    # Copyright (c) 2024 Mitchell Hashimoto, Ghostty contributors.
    # The license text is installed by the terminfo-licenses part.
    plugin: nil
    source: http://archive.ubuntu.com/ubuntu/pool/universe/g/ghostty/ghostty_1.3.0~us1-0ubuntu1.1_amd64.deb
    source-type: deb
    source-checksum: sha256/8614ef9bcdf22da2efe7c63eac67bc61b9fabade823b060bb9580560e94f4acd
    override-build: |
      set -eux
      install -Dm644 "$CRAFT_PART_SRC/usr/share/terminfo/x/xterm-ghostty" \
        "$CRAFT_PART_INSTALL/usr/share/terminfo/x/xterm-ghostty"
  terminfo-licenses:
    # ncurses-term already carries the notices for the kitty, foot, ghostty and
    # wezterm entries it ships. This adds the MIT notice for the xterm-ghostty
    # entry extracted from the ghostty package.
    plugin: nil
    source: snap/local/licenses
    override-build: |
      set -eux
      install -Dm644 ghostty.txt \
        "$CRAFT_PART_INSTALL/usr/share/doc/ghostty-terminfo/copyright"
  libdrm:
    source: https://gitlab.freedesktop.org/mesa/drm.git
    source-tag: libdrm-2.4.113
    plugin: meson
    meson-parameters:
    - --prefix=/usr
    - --sysconfdir=/etc
    - --libdir=lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR
    - -Dradeon=enabled
    - -Damdgpu=enabled
    - -Dudev=true
    - -Dnouveau=enabled
    - -Dintel=enabled
    build-packages:
    - meson
    - pkg-config
    - libudev-dev
    - libpciaccess-dev
    stage-packages:
    - libpciaccess0
    prime:
    - -usr/include
    - -usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pkgconfig
  nvtop:
    after: [ libdrm ]
    source: .
    plugin: cmake
    cmake-parameters:
    - -DCMAKE_INSTALL_PREFIX=/usr
    - -DNVIDIA_SUPPORT=ON
    - -DAMDGPU_SUPPORT=ON
    - -DINTEL_SUPPORT=ON
    override-pull: |
      set -eux
      craftctl default
      VERSION="$(git describe --tags $(git rev-list --tags --max-count=1))"
      craftctl set version=$VERSION
      git checkout $VERSION
    build-snaps:
    - cmake
    build-packages:
    - build-essential
    - libncurses-dev
    - libsystemd-dev
    stage-packages:
    - libncurses6
    - libncursesw6
    - libsystemd0
    - ncurses-base
    - ncurses-term
