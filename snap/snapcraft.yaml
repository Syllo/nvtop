name: nvtop
base: core22
adopt-info: nvtop
summary: 'GPUs monitoring tool for AMD, Intel and NVIDIA'
description: |
  Nvtop stands for Neat Videocard TOP, a (h)top like task monitor for AMD, Intel and NVIDIA GPUs. It can handle multiple GPUs and print information about them in a htop familiar way.
license: GPL-3.0-or-later
issues: https://github.com/Syllo/nvtop/issues
icon: desktop/nvtop.svg
grade: stable
confinement: strict
architectures:
- build-on: amd64
- build-on: arm64
- build-on: armhf
- build-on: ppc64el
- build-on: s390x
compression: lzo
apps:
  nvtop:
    command: usr/bin/nvtop
    desktop: usr/share/applications/nvtop.desktop
    plugs:
    - opengl
    - home
    - hardware-observe
    - process-control
    - system-observe
    # - kubernetes-support # Temporarily required for nvtop to display AMD GPU processes. Once apparmor rule to allow access to @{PROC}/[0-9]*/fdinfo/ is added to system-observe, this can be removed.
    environment:
      # The staged terminfo db is not in ncurses' compiled-in search path, so
      # point TERMINFO_DIRS at it; ncurses still searches the base snap's
      # locations afterwards.
      TERMINFO_DIRS: $SNAP/usr/share/terminfo
# layout:
#   /usr/share/libdrm:
#     symlink: $SNAP/usr/share/libdrm
parts:
  ghostty-terminfo:
    # Upstream Ghostty publishes only a terminfo generator, not a file, and
    # core22's ncurses 6.3 predates the entry. The Ubuntu "ghostty" package
    # ships the compiled xterm-ghostty entry; the terminfo payload is
    # architecture-independent data, so the amd64 binary package is used for
    # every build target.
    #
    # The terminfo data is MIT-licensed:
    # Copyright (c) 2024 Mitchell Hashimoto, Ghostty contributors.
    # The license text is installed by the terminfo-licenses part.
    plugin: nil
    source: http://archive.ubuntu.com/ubuntu/pool/universe/g/ghostty/ghostty_1.3.0~us1-0ubuntu1_amd64.deb
    source-type: deb
    source-checksum: sha256/5b597b97a13e7fab6e25b2c9c0f713e206c16ff9c629293c3459d1ecac39a2f7
    build-packages:
    - ncurses-bin
    override-build: |
      set -eux
      terminfo_dir="$CRAFT_PART_INSTALL/usr/share/terminfo"
      mkdir -p "$terminfo_dir"
      # Decompile with core22's ncurses, then recompile with the same version so
      # the entry is in the base's native format and the "ghostty" alias is
      # created alongside "xterm-ghostty".
      TERMINFO="$CRAFT_PART_SRC/usr/share/terminfo" \
        infocmp -x -1 xterm-ghostty > ghostty.terminfo
      tic -x -o "$terminfo_dir" ghostty.terminfo
  wezterm-terminfo:
    # WezTerm publishes its terminfo as a plain source file; pin the commit and
    # let the build verify the checksum.
    #
    # termwiz/data/wezterm.terminfo, last changed 2025-05-03 ("Advertize the Su
    # capability too"). The newest tagged release predates that commit, so pin
    # the commit rather than the tag.
    #
    # The terminfo data is MIT-licensed:
    # Copyright (c) 2018-Present Wez Furlong.
    # The license text is installed by the terminfo-licenses part.
    plugin: nil
    source: https://raw.githubusercontent.com/wezterm/wezterm/52c3515037518b826f32609179383948217d5a33/termwiz/data/wezterm.terminfo
    source-type: file
    source-checksum: sha256/5e386fb149b2a16b71b4d9a373c54737c9e5694eb67fe38d93b24705b93437ed
    build-packages:
    - ncurses-bin
    override-build: |
      set -eux
      terminfo_dir="$CRAFT_PART_INSTALL/usr/share/terminfo"
      mkdir -p "$terminfo_dir"
      tic -x -o "$terminfo_dir" wezterm.terminfo
  terminfo-licenses:
    # MIT license texts for the bundled third-party terminfo entries. The MIT
    # license asks that the copyright and permission notice be included with
    # copies, so they are installed into the snap under usr/share/doc.
    #
    # ghostty.txt matches Ghostty's LICENSE at the packaged version (1.3.0);
    # wezterm.txt matches LICENSE.md at the pinned WezTerm commit above.
    plugin: nil
    source: snap/local/licenses
    override-build: |
      set -eux
      install -Dm644 ghostty.txt \
        "$CRAFT_PART_INSTALL/usr/share/doc/ghostty-terminfo/copyright"
      install -Dm644 wezterm.txt \
        "$CRAFT_PART_INSTALL/usr/share/doc/wezterm-terminfo/copyright"
  libdrm:
    source: https://gitlab.freedesktop.org/mesa/drm.git
    source-tag: libdrm-2.4.113
    plugin: meson
    meson-parameters:
    - --prefix=/usr
    - --sysconfdir=/etc
    - --libdir=lib/$CRAFT_ARCH_TRIPLET
    - -Dradeon=enabled
    - -Damdgpu=enabled
    - -Dudev=true
    - -Dnouveau=enabled
    - -Dintel=enabled
    build-packages:
    - meson
    - pkg-config
    - libudev-dev
    - libpciaccess-dev
    stage-packages:
    - libpciaccess0
    prime:
    - -usr/include
    - -usr/lib/$CRAFT_ARCH_TRIPLET/pkgconfig
  nvtop:
    after: [ libdrm ]
    source: .
    plugin: cmake
    cmake-parameters:
    - -DCMAKE_INSTALL_PREFIX=/usr
    - -DNVIDIA_SUPPORT=ON
    - -DAMDGPU_SUPPORT=ON
    - -DINTEL_SUPPORT=ON
    override-pull: |
      set -eux
      craftctl default
      VERSION="$(git describe --tags $(git rev-list --tags --max-count=1))"
      craftctl set version=$VERSION
      git checkout $VERSION
    build-snaps:
    - cmake
    build-packages:
    - gcc
    - libncurses-dev
    - libsystemd-dev
    stage-packages:
    - libncurses6
    - libncursesw6
    - libsystemd0
    - ncurses-base
    - ncurses-term
    - kitty-terminfo
    - foot-terminfo
    prime:
    - -usr/share/doc
