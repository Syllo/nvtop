name: Compile

on:
  - push
  - pull_request

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os: [ubuntu-26.04, ubuntu-24.04, ubuntu-22.04, macos-26]

    env:
      BUILD_DIR: build
      DEBIAN_FRONTEND: noninteractive

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libncurses-dev libdrm-dev libsystemd-dev libgtest-dev

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install googletest

    - name: Configure CMake
      run: cmake -S . -B $BUILD_DIR -DBUILD_TESTING=ON

    - name: Build
      run: cmake --build $BUILD_DIR

    - name: Test
      run: ctest --test-dir $BUILD_DIR --output-on-failure

    - name: Install
      run: DESTDIR="$PWD/build/install" cmake --build $BUILD_DIR --target install
      
    - name: Upload
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: nvtop ${{ matrix.os }}
        path: ${{ env.BUILD_DIR }}/install
