name: Compile

on:
  - push
  - pull_request

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os: [ubuntu-latest, ubuntu-24.04, ubuntu-22.04, macos-26]

    env:
      BUILD_DIR: build
      DEBIAN_FRONTEND: noninteractive

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libncurses5-dev libncursesw5-dev libdrm-dev libsystemd-dev libgtest-dev

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install googletest

    - name: Configure CMake
      run: cmake -S . -B $BUILD_DIR -DBUILD_TESTING=ON

    - name: Build
      run: cmake --build $BUILD_DIR

    - name: Test
      run: ctest --test-dir $BUILD_DIR --output-on-failure

    - name: Install
      run: DESTDIR="$PWD/build/install" cmake --build $BUILD_DIR --target install
      
    - name: Upload
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: nvtop ${{ matrix.os }}
        path: ${{ env.BUILD_DIR }}/install
