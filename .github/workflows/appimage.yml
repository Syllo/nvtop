name: AppImage

on:
  release:
    types: [published]
  pull_request:
    paths:
      - ".github/workflows/appimage.yml"
      - "AppImage/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appimage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      # Pull request builds must not get repository write access. The build
      # runs untrusted PR code in a container, so no credentials are persisted
      # in the checked-out .git directory either.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify container architecture
        run: |
          actual="$(docker run --rm almalinux:8 uname -m)"
          echo "Container architecture: $actual"
          test "$actual" = "${{ matrix.arch }}"

      - name: Build AppImage
        run: |
          docker run --rm \
            -v "$PWD:/nvtop" \
            -w /nvtop \
            almalinux:8 \
            ./AppImage/make_appimage.sh

      - name: Fix file ownership
        if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" \
            build AppDir appimagetool nvtop-*.AppImage 2>/dev/null || true

      - name: Upload workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nvtop-${{ matrix.arch }}-AppImage
          path: nvtop-*.AppImage
          if-no-files-found: error

  release:
    name: Attach to release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download AppImage artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nvtop-*-AppImage
          merge-multiple: true
          path: artifacts

      - name: Attach AppImages to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null; then
            if [[ "${{ github.event_name }}" == "release" ]]; then
              echo "::error::Release $RELEASE_TAG not found"
              exit 1
            fi
            echo "Release $RELEASE_TAG does not exist; skipping."
            exit 0
          fi
          gh release upload "$RELEASE_TAG" artifacts/nvtop-*.AppImage --clobber
